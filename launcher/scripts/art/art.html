<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family: 'Gothic'; font-weight: 800; src: url(../../src/renderer/fonts/grenze-gotisch-latin-800-normal.woff2); }
@font-face { font-family: 'Unicase'; font-weight: 700; src: url(../../src/renderer/fonts/cormorant-unicase-cyrillic-700-normal.woff2); unicode-range: U+0400-045F; }
@font-face { font-family: 'Unicase'; font-weight: 700; src: url(../../src/renderer/fonts/cormorant-unicase-latin-700-normal.woff2); unicode-range: U+0000-00FF,U+2000-206F; }
html, body { margin: 0; background: transparent; overflow: hidden; }
.art { display: none; position: relative; overflow: hidden; }
body[data-art="icon"] #icon, body[data-art="sidebar"] #sidebar, body[data-art="unsidebar"] #sidebar, body[data-art="header"] #header { display: block; }
#icon { width: 512px; height: 512px; }
#icon svg { width: 512px; height: 512px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
#sidebar { width: 164px; height: 314px; background: linear-gradient(#0a1230 0%, #1b2a5c 55%, #3b3350 78%, #2a2230 100%); }
#sidebar .t { position: absolute; left: 0; right: 0; top: 116px; text-align: center; font: 800 27px Gothic; color: #f2d27c; text-shadow: 0 2px 0 #3a2508, 0 0 12px rgba(242,210,124,.35); }
#sidebar .s { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font: 700 11px Unicase; color: #c9b98f; letter-spacing: .5px; }
#sidebar .frame { position: absolute; inset: 4px; border: 1px solid rgba(212,168,75,.55); outline: 1px solid rgba(212,168,75,.25); outline-offset: 2px; }
#header { width: 150px; height: 57px; background: #1b1e2a; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">

    <symbol id="fleur" viewBox="0 0 100 100">

      <rect x="33" y="50" width="34" height="8" rx="2"/>

    </symbol>
    <symbol id="crest" viewBox="0 0 100 120">

    <g id="castle">
      <!-- силуэт замка: стены, башни с конусами, донжон -->
      <rect x="10" y="60" width="144" height="40" fill="#1a1d29"/>

      <rect x="4" y="34" width="24" height="66" fill="#222636"/><path d="M1 35L16 4l15 31Z" fill="#23407e"/>
      <rect x="136" y="34" width="24" height="66" fill="#222636"/><path d="M133 35L148 4l15 31Z" fill="#23407e"/>
      <rect x="62" y="22" width="40" height="78" fill="#262a3b"/><path d="M58 23L82 -16l24 39Z" fill="#2c4f97"/>
      <path d="M82 -16v-12" stroke="#d4a84b" stroke-width="1.5"/><path d="M82 -28h12l-3 3 3 3H82Z" fill="#b5302a"/>

      <rect x="40" y="72" width="4" height="7" rx="2" fill="#f2b84b" opacity=".8"/><rect x="120" y="72" width="4" height="7" rx="2" fill="#f2b84b" opacity=".8"/>
    </g>
  </defs>
</svg>

<div class="art" id="icon"><svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet"><use href="#crest"/></svg></div>

<div class="art" id="sidebar">
  <svg width="164" height="314" style="position:absolute;inset:0">
    <g fill="#fff">
      <circle cx="20" cy="22" r=".9"/><circle cx="140" cy="16" r="1.1"/><circle cx="118" cy="60" r=".8"/><circle cx="30" cy="80" r="1"/>
      <circle cx="150" cy="96" r=".8"/><circle cx="12" cy="150" r=".9"/><circle cx="70" cy="168" r=".7"/><circle cx="150" cy="176" r="1"/>
    </g>
    <circle cx="132" cy="186" r="11" fill="#f4ecc8" opacity=".9"/>
    <path d="M0 250Q40 226 82 240T164 236V314H0Z" fill="#141a2c"/>
    <use href="#castle" transform="translate(0 214)"/>
    <rect x="0" y="300" width="164" height="14" fill="#0c0d12"/>
  </svg>
  <img src="../../src/renderer/logo.png" style="position:absolute;left:8px;top:26px;width:148px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))" alt="">
  <div class="t">KM Launcher</div>
  <div class="s" id="sub">Врата королевства</div>
  <div class="frame"></div>
</div>

<div class="art" id="header">
  <img src="../../src/renderer/logo.png" style="position:absolute;right:6px;top:5px;height:47px" alt="">
  <svg style="position:absolute;right:54px;top:14px;width:30px;height:30px;opacity:.35" viewBox="0 0 100 100" fill="#9c7430"><use href="#fleur"/></svg>
</div>
<script>
const art = new URLSearchParams(location.search).get('art');
document.body.dataset.art = art;
if (art === 'unsidebar') document.getElementById('sub').textContent = 'До новых походов';
</script>
</body></html>
